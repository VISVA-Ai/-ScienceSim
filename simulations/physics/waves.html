<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Motion - ScienceSim</title>
    <meta name="description"
        content="Interactive wave motion simulation. Study transverse and longitudinal waves, amplitude, and frequency.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body class="physics-page">
    <div class="bg-mesh"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">
                <span class="logo-icon">⚛</span>
                <span class="logo-text">ScienceSim</span>
            </a>
            <div class="nav-links">
                <a href="../../index.html" class="nav-link">Home</a>
                <a href="../../physics.html" class="nav-link active">Physics</a>
                <a href="../../chemistry.html" class="nav-link">Chemistry</a>
                <a href="../../about.html" class="nav-link">About</a>
            </div>
            <button class="nav-mobile-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <div class="sim-layout">
        <aside class="sim-sidebar">
            <a href="../../physics.html" class="btn btn-secondary" style="margin-bottom: 20px; font-size: 0.875rem;">
                ← Back to Physics Lab
            </a>

            <h1 class="sim-title">Wave Motion</h1>
            <p class="sim-description">
                Visualize how energy travels through a medium. 
                Switch between wave types and adjust properties to see how they interact.
            </p>

            <div class="control-group">
                <h4 class="control-group-title">Wave Settings</h4>
                
                <div class="control-item">
                    <label class="control-label">Wave Type</label>
                    <div style="display: flex; gap: 8px;">
                        <button class="sim-btn sim-btn-primary" id="transverse-btn" style="font-size: 0.75rem; padding: 10px;">Transverse</button>
                        <button class="sim-btn sim-btn-secondary" id="longitudinal-btn" style="font-size: 0.75rem; padding: 10px;">Longitudinal</button>
                    </div>
                </div>

                <div class="control-item">
                    <label class="control-label">
                        <span>Amplitude (A)</span>
                        <span class="control-value" id="amp-value">40 px</span>
                    </label>
                    <input type="range" id="amp-slider" min="0" max="100" value="40" step="1">
                </div>

                <div class="control-item">
                    <label class="control-label">
                        <span>Frequency (f)</span>
                        <span class="control-value" id="freq-value">1.5 Hz</span>
                    </label>
                    <input type="range" id="freq-slider" min="0.1" max="5.0" value="1.5" step="0.1">
                </div>

                <div class="control-item">
                    <label class="control-label">
                        <span>Wavelength (λ)</span>
                        <span class="control-value" id="wave-value">200 px</span>
                    </label>
                    <input type="range" id="wave-slider" min="50" max="500" value="200" step="10">
                </div>

                <div class="control-item">
                    <label class="control-label">
                        <span>Damping</span>
                        <span class="control-value" id="damping-value">0.02</span>
                    </label>
                    <input type="range" id="damping-slider" min="0" max="0.2" value="0.02" step="0.01">
                </div>
            </div>

            <div class="sim-buttons">
                <button class="sim-btn sim-btn-primary" id="play-pause-btn" style="flex: 2;">
                    <span>⏸ Pause</span>
                </button>
                <button class="sim-btn sim-btn-secondary" id="pulse-btn" style="flex: 1;">
                    ⚡ Pulse
                </button>
            </div>

            <div class="control-group" style="margin-top: 16px;">
                <h4 class="control-group-title">Wave Equation</h4>
                <div style="font-size: 0.8rem; color: var(--text-muted); font-family: 'Outfit', sans-serif;">
                    y(x, t) = A · sin(k·x - ω·t)
                </div>
            </div>
        </aside>

        <div class="sim-viewport">
            <!-- Navigation/Status Overlay -->
            <div style="position: absolute; top: 20px; left: 20px; z-index: 10; font-size: 0.8rem; color: var(--text-secondary); background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border);">
                <div>Wave Speed (v): <span id="v-data" style="color: var(--physics-glow); font-weight: 600;">...</span></div>
                <div style="margin-top: 4px;">k = 2π/λ | ω = 2πf</div>
            </div>

            <div class="sim-container" id="canvas-container"></div>
        </div>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="waves.js"></script>
</body>

</html>
